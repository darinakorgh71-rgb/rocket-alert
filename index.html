<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>Rocket Alert</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;margin:0}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{max-width:520px;width:100%;text-align:center}
.icon{font-size:64px}.status{padding:18px;border-radius:16px;background:#222;margin:20px 0}
button{font-size:18px;padding:16px 22px;border:0;border-radius:14px;margin:8px;cursor:pointer}
.danger{background:#d00;color:#fff}.secondary{background:#333;color:#fff}
small{color:#aaa;display:block;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<main><div class="card">
<div class="icon">🚀</div>
<h1>Rocket Alert</h1>
<div class="status" id="status">Готово до налаштування</div>
<button class="danger" id="enable">Увімкнути сповіщення</button>
<button class="secondary" id="test">Тестовий сигнал</button>
<small>Код події: ROCKET_KRYVYI_RIH<br>Це додаткове сповіщення. Воно не замінює офіційні повідомлення про повітряну тривогу.</small>
</div></main>
<script>
const status=document.getElementById('status');
async function enable(){
  if(!('Notification' in window)){status.textContent='Цей браузер не підтримує сповіщення.';return}
  const p=await Notification.requestPermission();
  status.textContent=p==='granted'?'🔔 Сповіщення дозволені.':'Сповіщення не дозволені.';
}
document.getElementById('enable').onclick=enable;

document.getElementById('test').onclick=()=>{
  if(Notification.permission!=='granted'){status.textContent='Спочатку натисни «Увімкнути сповіщення».';return}
  new Notification('🚀 РАКЕТА — КРИВИЙ РІГ',{
    body:'ТЕСТОВИЙ СИГНАЛ. Перевір офіційні повідомлення.',
    tag:'ROCKET_KRYVYI_RIH'
  });
  status.textContent='Тестове сповіщення відправлено.';
};

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.error);
</script>
</body>
</html>
